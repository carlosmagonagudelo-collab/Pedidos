<style>
/* Ponkezza · marca: verde petróleo, dorado oliva y crema. Itim + Nunito. */
:root{color-scheme:light dark;--brand:#1a3c3d;--brand2:#245152;--gold:#c9c98a;--cream:#fcf7ea;
--bg:light-dark(#fbf8f0,#0f1c1c);--card:light-dark(#fff,#172828);--ink:light-dark(#152a2a,#f2eedf);--mut:light-dark(#5b6b66,#a9b5ad);--line:light-dark(#e3e0cf,#294040);
--pri:light-dark(#1a3c3d,#c9c98a);--onpri:light-dark(#fcf7ea,#102020);--tint:light-dark(#ecefe2,#1f3434);
--ok:light-dark(#1d7349,#74d6a3);--warn:light-dark(#8a5a00,#ffc36b);--bad:light-dark(#b3261e,#ff8a80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.disp{font-family:Itim,Nunito,sans-serif;font-weight:400;line-height:1.08;margin:0;text-wrap:balance}
h2{font-size:clamp(28px,4vw,40px)}h3{font-size:21px}
p{margin:.3em 0}.mut{color:var(--mut)}.small{font-size:14px}.nowrap{white-space:nowrap}
a{color:inherit}
.btn{font:700 16px Nunito,sans-serif;border:0;border-radius:12px;padding:10px 16px;min-height:44px;background:var(--pri);color:var(--onpri);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.g{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.y{background:var(--gold);color:#152a2a}
.btn.s{min-height:36px;padding:6px 11px;font-size:14px}.btn.w{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}
input,select,textarea{font:16px Nunito,sans-serif;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:44px}
textarea{resize:vertical;min-height:80px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;background:var(--tint);color:var(--ink);white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}.chip.w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.chip.b{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.empty{border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--mut)}
.spin{display:inline-block;width:16px;height:16px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.brandbar{background:var(--brand);color:var(--cream)}
.brandbar img.logo{width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 2px var(--gold);flex:none}
.demo-ribbon{background:var(--gold);color:#152a2a;font-size:13px;font-weight:700;text-align:center;padding:4px 10px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:14px;color:var(--mut);font-weight:700}td.r,th.r{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}

</style>
<style>
/* VOICE: tablero de trabajo, claro y directo, para usar entre hornadas.
   IDEA: el tablero de despacho de una panadería: comandas, rutas y caja.
   PICTURE: cada pestaña abre con su herramienta: ruta con horas grandes, mapa esquemático, semáforo del asesor.
   COLOUR/TYPE: verde petróleo de marca, dorado de acento, fondo crema; Itim para títulos, Nunito para datos.
   LAYOUT: banda superior con logo y pestañas; contenido a 1240 px; tarjetas que se apilan en el celular. */
.top{padding:12px max(4vw,14px) 0;position:sticky;top:0;z-index:5}
.brand{display:flex;gap:12px;align-items:center}.brand h1{font-size:24px}.brand p{margin:0;font-size:13px;color:var(--gold)}
.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs a{flex:none;color:var(--cream);text-decoration:none;font-weight:700;padding:10px 13px;border-radius:12px 12px 0 0;min-height:44px;display:flex;align-items:center;gap:6px}
.tabs a[aria-current]{background:var(--bg);color:var(--ink)}
.tabs .n{background:var(--gold);color:#152a2a;border-radius:10px;font-size:12px;padding:0 7px}
main{max-width:1240px;margin:0 auto;padding:22px max(4vw,14px) 70px}
.view{display:none}.view.on{display:block}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px}
.kpi b{display:block;font:400 clamp(22px,3vw,30px)/1.1 Itim,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi span{font-size:14px;color:var(--mut)}
.kpi.hi{background:var(--brand);color:var(--cream);border-color:transparent}.kpi.hi span{color:var(--gold)}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 12px}
.note{padding:10px 14px;border-radius:12px;background:var(--tint);font-size:15px;margin:0 0 14px}
.tip{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px}
.dot{width:12px;height:12px;border-radius:50%;margin-top:6px;background:var(--bad)}.dot.ok{background:var(--ok)}.dot.w{background:var(--warn)}
.stop{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.stop .t{font:400 26px/1 Itim,sans-serif}.stop .t small{display:block;font:700 12px Nunito,sans-serif;color:var(--mut);margin-top:4px}
.stop .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:end}
.trip{background:var(--tint);border-radius:12px;padding:8px 12px;margin:12px 0 4px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-weight:700}
.repcard{border-top:6px solid var(--brand)}
.fig{position:relative;min-height:380px;background:var(--tint);border-radius:16px;overflow:hidden}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.bars{display:flex;align-items:end;gap:3px;height:170px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;height:100%;gap:4px}
.bars i{display:block;width:100%;background:var(--pri);border-radius:5px 5px 0 0;min-height:2px}.bars s{text-decoration:none;font-size:11px;color:var(--mut)}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 90px;gap:8px;align-items:center;font-size:14px;margin:6px 0}.hbar i{display:block;height:14px;border-radius:7px;background:var(--gold)}
.meter{height:16px;border-radius:9px;background:var(--tint);overflow:hidden}.meter i{display:block;height:100%;background:var(--pri)}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit}
.prod .ph{aspect-ratio:4/3;background:var(--brand);overflow:hidden}.prod .ph img,.prod .ph svg{width:100%;height:100%;object-fit:cover;display:block}
.prod .bd{padding:10px 13px 13px}.prod b{display:block;font:400 18px/1.15 Itim,sans-serif}
.sem{display:flex;gap:16px;align-items:center}.sem .luz{width:64px;height:64px;border-radius:50%;flex:none;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.luz.verde{background:#2f9b62}.luz.amarillo{background:#e0b33a}.luz.rojo{background:#c8453a}
.acc{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;background:var(--card)}
.acc h4{margin:0 0 4px;font:400 20px/1.15 Itim,sans-serif}
.ov{position:fixed;inset:0;background:rgba(10,25,25,.6);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:4vh 12px}
.ov[hidden]{display:none}.sheet{background:var(--card);border-radius:20px;padding:20px;width:min(760px,100%)}
.ingt input{padding:7px 8px;min-height:40px}.ingt td{padding:4px 3px}
.login{max-width:420px;margin:12vh auto;text-align:center}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--brand);color:var(--cream);padding:10px 18px;border-radius:12px;z-index:30;font-weight:700;max-width:92vw}
.toast[hidden]{display:none}
.checks{display:flex;flex-wrap:wrap;gap:6px}.checks label{display:flex;gap:6px;align-items:center;font-weight:600;margin:0;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px}
.checks input{width:auto;min-height:0}
@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--mut)}.stack td:empty{display:none}.stop{grid-template-columns:58px minmax(0,1fr)}.stop .acts{grid-column:1/-1;justify-content:start}.hbar{grid-template-columns:80px minmax(0,1fr) 76px}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>

<script>
/* Ponkezza · datos en Google Forms + Google Sheets, sin código de servidor.

   Prefijos de cada fila:  C| público firmado · O| pedido cifrado de un cliente · E| evento privado del día a día · K| registro privado duradero */
(function () {

  let K = null; // llaves importadas
  async function importar(L) {

  function aplicar(ev, rowT) {
    const ts = PK.num(ev.ts) || 0, set = (col, id, obj) => { const cur = D[col][id]; if (!cur || ts >= PK.num(cur._ts)) D[col][id] = { ...obj, _ts: ts }; };
    switch (ev.t) {

      case 'est': { const p = D.pedidos[ev.id]; if (p && ts >= PK.num(p._ts)) { for (const k of ['estado', 'pagado', 'entregadoEn', 'repartidor', 'notas', 'ruta']) if (ev[k] !== undefined) p[k] = ev[k]; p._ts = ts; p.ts = ts; } break; }
      case 'cfgp': if (ts >= PK.num(D.cfgp._ts)) D.cfgp = { ...ev.c, _ts: ts }; break;
      case 'rec': set('recetas', ev.r.id, ev.r); break;
      case 'gas': set('gastos', ev.g.id, ev.g); break;
      case 'mem': if (!D.memoria || ts >= PK.num(D.memoria._ts)) D.memoria = { ...ev.m, _ts: ts }; break;

  function catalogoConFotos() { return lista('catalogo').map(p => ({ ...p, foto: (D.fotos[p.id] && D.fotos[p.id].u) || '' })); }

    for (const r of rows) {

  };
  T.estado = async numeroP => {
    const n = String(numeroP || '').replace(/[^A-Z0-9-]/gi, '').toUpperCase();

  };
  async function publicarCupos() {
    const m = {}, hoy = PK.today();

  T.repartidor = async fecha => {

    return { fecha, config: configuracion(), pedidos: lista('pedidos').filter(p => p.fecha === fecha && p.estado !== 'cancelado') };
  };
  T.entregar = async b => {
    const p = D.pedidos[b.id]; if (!p) throw new Error('Pedido no encontrado');

    const ok = await N.enviar(await privado('E', ev));

    if (!ok) throw new Error('Sin señal: quedó guardado en el celular y se enviará solo cuando vuelva la conexión.');

  /* ---------- arranque según el tipo de página ---------- */

      else L = N.llaveDe(PK.ls.get('pk-llave', ''));
      if (!L) return false;
      N.llave = L; N.form = { f: L.f, e: L.e }; await importar(L);
    }
    N.activo = true; PK.demo = false; Object.assign(PK.store, T);

  };
  N.salir = () => { PK.ls.del('pk-llave'); location.reload(); };

  /* ---------- configuración inicial (desde el panel) ---------- */
  N.parseForm = t => { const s = String(t || ''); const f = s.match(/\/forms\/d\/e\/([\w-]+)/), e = s.match(/entry\.(\d+)/); return f && e ? { f: f[1], e: e[1] } : null; };
  N.parseHoja = t => { const m = String(t || '').match(/\/spreadsheets\/d\/([\w-]{20,})/); return m ? m[1] : (/^[\w-]{30,}$/.test(String(t).trim()) ? String(t).trim() : null); };
  N.configurar = async ({ form, hoja, wa, nombre }) => {
    const L = await N.crearLlave(hoja, form.f, form.e);
    N.llave = L; N.form = { f: L.f, e: L.e }; await importar(L);
    D = vacio(); D.sys = { f: L.f, e: L.e, x: L.dk.x, y: L.dk.y, wa: String(wa || '').replace(/\D/g, '') };
    const cfg = { ...PK.DEF, nombre: nombre || 'Ponkezza' };
    N.activo = true; PK.demo = false; Object.assign(PK.store, T);

  N.cambiarWhatsApp = async wa => { D.sys = { ...D.sys, wa: String(wa || '').replace(/\D/g, '') }; await T.guardar('config', configuracion()); };
  N.whatsapp = () => (D && D.sys && D.sys.wa) || '';
  N.verificar = async () => { const rows = await N.leer(N.llave.s, `select A,B where B starts with 'C|'`); for (const r of rows) { const ev = await abrir(r.b); if (ev && ev.t === 'cfg') return true; } return false; };
  N.enlaces = () => {
    const L = N.llave, base = location.href.replace(/[#?].*$/, '').replace(/[^/]*$/, ''), k = N.llaveTexto(L);
    return { cliente: base + '#s=' + L.s + '&v=' + L.sk.x + '.' + L.sk.y, repartidor: base + 'ruta.html#k=' + k, panel: base + 'panel.html#k=' + k };

<script>
/* Ponkezza · planificador de rutas (TMS).
   Ruteo con ventanas horarias, varios repartidores y capacidad por viaje.
   Tiempos reales con OSRM (OpenStreetMap, gratuito) cuando hay internet; si no, estimación por distancia. */
(function () {
  const T = (PK.tms = {});
  const toMin = PK.toMin;

  T.matriz = async (pts, cfg) => {
    const n = pts.length;
    if (cfg.usarOSRM !== false && n > 1 && n <= 90) {
      try {
        const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 9000);
        const coords = pts.map(p => p.lng.toFixed(6) + ',' + p.lat.toFixed(6)).join(';');
        const r = await fetch('https://router.project-osrm.org/table/v1/driving/' + coords + '?annotations=duration,distance', { signal: ctl.signal });
        clearTimeout(to); const j = await r.json();
        if (j.code === 'Ok' && j.durations) {
          const f = PK.num(cfg.factorTrafico) || 1.4;
          return { min: j.durations.map(row => row.map(s => (s == null ? 999 : s / 60 * f))), km: j.distances.map(row => row.map(m => (m == null ? 99 : m / 1000))), fuente: 'mapa' };
        }
      } catch (e) {}
    }
    const v = PK.num(cfg.velocidad) || 18;
    const km = pts.map(a => pts.map(b => (PK.km(a, b) || 0) * 1.35));
    return { min: km.map(r => r.map(k => k / v * 60)), km, fuente: 'estimado' };
  };

  // Simula una ruta (lista de índices de pedido) para un repartidor
  function simular(route, rep, X) {
    const { M, K, P, cfg } = X;
    const cap = Math.max(1, Math.round(PK.num(cfg.capacidadViaje)) || 6), serv = PK.num(cfg.minutosParada) || 5, carga = PK.num(cfg.minutosCarga) || 10;
    const ini = toMin(rep.inicio) ?? 480, finRep = toMin(rep.fin) ?? 1140;
    let t = ini, tarde = 0, km = 0, mov = 0; const viajes = [];
    const pase = (tramo, salida) => {
      let cur = salida, prev = 0, kmv = 0; const par = [];
      for (const i of tramo) { const lleg = cur + M[prev][i + 1]; const at = Math.max(lleg, P[i].ini); par.push({ i, llegada: at, espera: at - lleg, tarde: Math.max(0, at - P[i].fin), km: K[prev][i + 1] }); kmv += K[prev][i + 1]; cur = at + serv; prev = i + 1; }
      return { salida, par, regreso: cur + M[prev][0], km: kmv + K[prev][0] };
    };
    const salidaDe = (tramo, minSal) => Math.max(minSal, P[tramo[0]].ini - M[0][tramo[0] + 1]);
    let k = 0;
    while (k < route.length) {
      const minSal = t + (viajes.length ? carga : 0) + (viajes.length ? 0 : carga);
      const tramo = [route[k++]];
      // agrega paradas al viaje mientras quepan y no implique esperar más de lo que toma volver a cargar
      while (k < route.length && tramo.length < cap) {
        const nx = route[k], v = pase(tramo.concat(nx), salidaDe(tramo, minSal)), u = v.par[v.par.length - 1];
        const prevIdx = tramo[tramo.length - 1] + 1, volver = M[prevIdx][0] + carga + M[0][nx + 1];
        if (u.espera > volver + 15) break;
        tramo.push(nx); k++;
      }
      let v = pase(tramo, salidaDe(tramo, minSal));
      // retrasa la salida si hay esperas que se pueden evitar sin llegar tarde
      for (let it = 0; it < 3; it++) {
        const w = v.par.findIndex(p => p.espera > 0.5); if (w < 0) break;
        const holg = Math.min(...v.par.slice(0, w).map(p => P[p.i].fin - p.llegada), Infinity);
        const d = Math.min(v.par[w].espera, holg); if (d < 0.5) break;
        v = pase(tramo, v.salida + d);
      }
      viajes.push(v); t = v.regreso; km += v.km; mov += v.regreso - v.salida;
      tarde += v.par.reduce((a, p) => a + p.tarde, 0);
    }
    const extra = Math.max(0, t - finRep);
    return { viajes, km, tarde, fin: t, costo: mov + tarde * 60 + extra * 25 + km * 0.5 };
  }

  T.planear = async (pedidos, cfgIn, opts = {}) => {
    const cfg = PK.cfg(cfgIn);
    const reps = (cfg.repartidores || []).filter(r => r.activo !== false).slice(0, 8);
    if (!reps.length) reps.push({ id: 'r1', nombre: 'Repartidor', inicio: '08:00', fin: '18:00' });
    const activos = pedidos.filter(p => !['entregado', 'cancelado'].includes(p.estado));
    const recoger = activos.filter(p => p.tipoEntrega === 'recoger').sort((a, b) => (a.franjaIni || '').localeCompare(b.franjaIni || ''));
    const dom = activos.filter(p => p.tipoEntrega !== 'recoger');
    const sinUbic = dom.filter(p => p.lat == null || p.lng == null);
    const ok = dom.filter(p => p.lat != null && p.lng != null);
    const res = { fuente: '', reps: [], sinUbic, recoger, totales: { pedidos: ok.length, km: 0, tarde: 0, ultima: null, aTiempo: 0 } };
    if (!ok.length) return res;
    const pts = [cfg.base, ...ok.map(p => ({ lat: +p.lat, lng: +p.lng }))];
    const MX = opts.matriz || await T.matriz(pts, cfg);
    res.fuente = MX.fuente;
    const P = ok.map(p => { const f = PK.franjaPorId(cfg, p.franja) || {}; return { ini: toMin(p.franjaIni || f.ini) ?? 0, fin: toMin(p.franjaFin || f.fin) ?? 1439 }; });
    const X = { M: MX.min, K: MX.km, P, cfg };
    const rutas = reps.map(() => []);
    const costoDe = r => simular(rutas[r], reps[r], X).costo;
    const costos = reps.map((_, r) => costoDe(r));
    const orden = ok.map((_, i) => i).sort((a, b) => P[a].fin - P[b].fin || P[a].ini - P[b].ini || X.M[0][b + 1] - X.M[0][a + 1]);
    const mejorInsercion = (i, excluir) => {
      let best = { c: Infinity };
      for (let r = 0; r < reps.length; r++) for (let k = 0; k <= rutas[r].length; k++) {
        const cand = rutas[r].slice(); cand.splice(k, 0, i);
        const c = simular(cand, reps[r], X).costo - costos[r];
        if (c < best.c - 1e-6) best = { c, r, k };
      }
      return best;
    };
    for (const i of orden) { const b = mejorInsercion(i); rutas[b.r].splice(b.k, 0, i); costos[b.r] = costoDe(b.r); }
    // mejora: reubicar cada pedido y 2-opt dentro de cada ruta
    for (let pasada = 0; pasada < 3; pasada++) {
      let mejoro = false;
      for (const i of orden) {
        const r0 = rutas.findIndex(rt => rt.includes(i)), k0 = rutas[r0].indexOf(i), c0 = costos[r0];
        rutas[r0].splice(k0, 1); costos[r0] = costoDe(r0);
        const b = mejorInsercion(i);
        if (b.c + costos[r0] < c0 - 0.5 || (b.r === r0 && b.k === k0)) { rutas[b.r].splice(b.k, 0, i); costos[b.r] = costoDe(b.r); if (!(b.r === r0 && b.k === k0)) mejoro = true; }
        else { rutas[r0].splice(k0, 0, i); costos[r0] = c0; }
      }
      for (let r = 0; r < reps.length; r++) {
        const rt = rutas[r];
        for (let a = 0; a < rt.length - 1; a++) for (let b = a + 1; b < rt.length; b++) {
          const cand = rt.slice(0, a).concat(rt.slice(a, b + 1).reverse(), rt.slice(b + 1));
          const c = simular(cand, reps[r], X).costo;
          if (c < costos[r] - 0.5) { rutas[r] = cand; costos[r] = c; mejoro = true; }
        }
      }
      if (!mejoro) break;
    }
    const minCarga = PK.num(cfg.minutosCarga) || 10;
    rutas.forEach((rt, r) => {
      const sim = simular(rt, reps[r], X);
      const viajes = sim.viajes.map(v => ({ salida: v.salida, listo: v.salida - minCarga, regreso: v.regreso, km: v.km, paradas: v.par.map(p => ({ pedido: ok[p.i], llegada: p.llegada, espera: p.espera, tarde: p.tarde, km: p.km, ini: P[p.i].ini, fin: P[p.i].fin })) }));
      res.reps.push({ rep: reps[r], viajes, km: sim.km, tarde: sim.tarde, fin: rt.length ? sim.fin : null, n: rt.length });
      res.totales.km += sim.km;
      viajes.forEach(v => v.paradas.forEach(p => { if (p.tarde > 0.5) res.totales.tarde++; else res.totales.aTiempo++; res.totales.ultima = Math.max(res.totales.ultima || 0, p.llegada); }));
    });
    return res;
  };

  T.mapsLink = (base, paradas) => {
    const c = p => (+p.lat).toFixed(6) + ',' + (+p.lng).toFixed(6);
    const st = paradas.map(p => p.pedido);
    if (!st.length) return '';
    const dest = st[st.length - 1], way = st.slice(0, -1).slice(0, 9);
    return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=' + c(base) + '&destination=' + c(dest) + (way.length ? '&waypoints=' + encodeURIComponent(way.map(c).join('|')) : '');
  };

  T.textoRepartidor = (r, cfg) => {
    const L = [`Ruta de ${r.rep.nombre} · ${cfg.nombre}`];
    r.viajes.forEach((v, k) => {
      L.push('', `VIAJE ${k + 1}: salir a las ${PK.hm(v.salida)}`);
      v.paradas.forEach((p, j) => { const o = p.pedido; L.push(`${j + 1}. ${PK.hm(p.llegada)} · ${o.numero} · ${o.cliente} · ${o.telefono}`, `   ${o.direccion}${o.barrio ? ' (' + o.barrio + ')' : ''}`, `   ${(o.items || []).map(i => i.cantidad + ' x ' + i.nombre).join(', ')}`, `   ${o.pagado ? 'Pagado' : 'Cobrar ' + PK.money(o.total)}${o.notas ? ' · ' + o.notas : ''}`, `   https://maps.google.com/?q=${(+o.lat).toFixed(6)},${(+o.lng).toFixed(6)}`); });
      L.push(`Regreso a Ponkezza: ${PK.hm(v.regreso)}`);
    });
    return L.join('\n');
  };

  // Dibujo esquemático de las rutas (SVG), sin depender de mapas externos
  T.COLORES = ['#1a3c3d', '#b0892d', '#7a3e8e', '#2e6fb5', '#c2513a', '#3f8f5a', '#8a6d3b', '#555'];
  T.svg = (plan, base, W, H) => {
    const pts = [base]; plan.reps.forEach(r => r.viajes.forEach(v => v.paradas.forEach(p => pts.push({ lat: +p.pedido.lat, lng: +p.pedido.lng }))));
    const lats = pts.map(p => p.lat), lngs = pts.map(p => p.lng), k = Math.cos(base.lat * Math.PI / 180);
    let x0 = Math.min(...lngs), x1 = Math.max(...lngs), y0 = Math.min(...lats), y1 = Math.max(...lats);
    const pad = 34, sx = (x1 - x0) * k || 0.01, sy = (y1 - y0) || 0.01, s = Math.min((W - 2 * pad) / sx, (H - 2 * pad) / sy);
    const cx = (W - sx * s) / 2, cy = (H - sy * s) / 2;
    const X = p => cx + (p.lng - x0) * k * s, Y = p => H - (cy + (p.lat - y0) * s);
    let out = '';
    plan.reps.forEach((r, ri) => { const col = T.COLORES[ri % T.COLORES.length]; r.viajes.forEach(v => { const L = [base, ...v.paradas.map(p => ({ lat: +p.pedido.lat, lng: +p.pedido.lng })), base]; out += `<polyline points="${L.map(p => X(p).toFixed(1) + ',' + Y(p).toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="${v === r.viajes[0] ? '' : '6 4'}" opacity=".85"/>`; }); });
    plan.reps.forEach((r, ri) => { const col = T.COLORES[ri % T.COLORES.length]; let n = 0; r.viajes.forEach(v => v.paradas.forEach(p => { n++; const x = X({ lat: +p.pedido.lat, lng: +p.pedido.lng }), y = Y({ lat: +p.pedido.lat, lng: +p.pedido.lng }); out += `<g><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="11" fill="${p.tarde > 0.5 ? '#b3261e' : col}" stroke="#fff" stroke-width="2"/><text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" font-family="Nunito,sans-serif">${n}</text></g>`; })); });
    const bx = X(base), by = Y(base);
    out += `<g><rect x="${(bx - 13).toFixed(1)}" y="${(by - 13).toFixed(1)}" width="26" height="26" rx="7" fill="#c9c98a" stroke="#1a3c3d" stroke-width="2.5"/><text x="${bx.toFixed(1)}" y="${(by + 5).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="800" fill="#1a3c3d" font-family="Nunito,sans-serif">P</text></g>`;
    return out;
  };
})();

<script>
/* Ponkezza · indicadores financieros y asesor con memoria (sin IA externa).
   El asesor combina reglas de gestión para panaderías con el historial guardado
   del negocio: cierres de cada mes, cambios de precio, consejos dados y decisiones. */
(function () {
  const F = (PK.fin = {});
  const { num, money, pct } = PK;

  F.recCost = r => {
    const rinde = Math.max(1, num(r.rinde) || 1);
    const ing = (r.ingredientes || []).reduce((s, i) => s + (num(i.cantCompra) > 0 ? num(i.precioCompra) / num(i.cantCompra) * num(i.cantUsada) : 0), 0);
    const total = (ing + num(r.manoObra) + num(r.empaque) * rinde) * (1 + num(r.indirectos) / 100);
    return { ing, ingUnit: ing / rinde, total, unit: total / rinde };
  };
  F.recetaDe = (D, p) => p && (D.recetas.find(r => r.productoId === p.id) || D.recetas.find(r => PK.norm(r.nombre) === PK.norm(p.nombre)));
  F.prodDe = (D, it) => D.catalogo.find(p => p.id === it.id) || D.catalogo.find(p => PK.norm(p.nombre) === PK.norm(it.nombre));
  F.margenProd = (D, p) => { const r = F.recetaDe(D, p); if (!r || !num(p.precio)) return null; const u = F.recCost(r).unit; return { unit: u, margen: (num(p.precio) - u) / num(p.precio), receta: r }; };
  F.meta = D => (num(PK.cfg(D.config).metaMargen) || 60) / 100;
  F.fijos = D => (PK.cfg(D.config).costosFijos || []).reduce((s, c) => s + num(c.valor), 0);

  F.rango = ym => {
    const [y, m] = ym.split('-').map(Number), dm = new Date(y, m, 0).getDate(), hoy = PK.today();
    const from = `${ym}-01`, to = `${ym}-${String(dm).padStart(2, '0')}`;
    const actual = PK.mes(hoy) === ym;
    return { from, to, dm, actual, trans: actual ? +hoy.slice(8) : dm };
  };
  F.mesAnterior = (ym, n = 1) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 - n, 1); return PK.iso(d).slice(0, 7); };

  F.calc = (D, ym) => {
    const cfg = PK.cfg(D.config), R = F.rango(ym);
    const delMes = D.pedidos.filter(p => p.fecha >= R.from && p.fecha <= R.to);
    const C = delMes.filter(p => p.estado === 'cancelado'), E = delMes.filter(p => p.estado === 'entregado');
    let ventas = 0, costo = 0, conCosto = 0, ingTeorico = 0, domCob = 0, nDom = 0;
    const prods = {}, dias = {}, dow = [0, 0, 0, 0, 0, 0, 0], franjas = {};
    for (const p of E) {
      domCob += num(p.domicilio); if (p.tipoEntrega !== 'recoger') nDom++;
      dias[p.fecha] = (dias[p.fecha] || 0) + num(p.subtotal);
      dow[PK.parseISO(p.fecha).getDay()] += num(p.subtotal);
      franjas[p.franjaIni || '?'] = (franjas[p.franjaIni || '?'] || 0) + 1;
      for (const it of p.items || []) {
        const q = num(it.cantidad), v = q * num(it.precio); ventas += v;
        const pr = F.prodDe(D, it), k = pr ? pr.id : 'n:' + it.nombre;
        const o = prods[k] || (prods[k] = { id: pr && pr.id, nombre: pr ? pr.nombre : it.nombre, u: 0, v: 0, c: 0, sin: false });
        o.u += q; o.v += v;
        const r = F.recetaDe(D, pr);
        if (r) { const rc = F.recCost(r); o.c += rc.unit * q; costo += rc.unit * q; conCosto += v; ingTeorico += rc.ingUnit * q; } else o.sin = true;
      }
    }
    const mb = conCosto > 0 ? (conCosto - costo) / conCosto : NaN;
    const gastos = D.gastos.filter(g => g.fecha >= R.from && g.fecha <= R.to);
    const gCat = {}; gastos.forEach(g => { gCat[g.categoria] = (gCat[g.categoria] || 0) + num(g.valor); });
    const insumos = gCat['Insumos'] || 0, otros = gastos.filter(g => g.categoria !== 'Insumos').reduce((s, g) => s + num(g.valor), 0);
    const fijosMes = F.fijos(D), fijos = fijosMes * R.trans / R.dm;
    const costoDom = nDom * num(cfg.costoPorEntrega);
    const utilB = isFinite(mb) ? ventas * mb : NaN;
    const utilN = isFinite(utilB) ? utilB - fijos - otros + domCob - costoDom : NaN;
    const proy = R.actual && R.trans ? ventas / R.trans * R.dm : ventas;
    const otrosProy = R.actual && R.trans ? otros / R.trans * R.dm : otros;
    const pe = isFinite(mb) && mb > 0 ? (fijosMes + otrosProy) / mb : NaN;
    // clientes
    const tels = [...new Set(E.map(p => PK.telNorm(p.telefono)).filter(Boolean))];
    const hist = {}; D.pedidos.filter(p => p.estado === 'entregado' && p.fecha <= R.to).forEach(p => { const t = PK.telNorm(p.telefono); hist[t] = (hist[t] || 0) + 1; });
    const recurrentes = tels.filter(t => hist[t] >= 2).length;
    // puntualidad
    const conHora = E.filter(p => p.entregadoEn && p.franjaFin);
    const aTiempo = conHora.filter(p => { const d = new Date(p.entregadoEn); return d.getHours() * 60 + d.getMinutes() <= PK.toMin(p.franjaFin) + 10; }).length;
    const porCobrar = E.filter(p => !p.pagado).reduce((s, p) => s + num(p.total), 0);
    return {
      ym, R, ventas, pedidos: E.length, ticket: E.length ? ventas / E.length : 0, costo, conCosto, sinCosto: ventas - conCosto, mb, utilB, utilN,
      fijos, fijosMes, otros, insumos, gCat, domCob, costoDom, nDom, proy, pe, cancel: delMes.length ? C.length / delMes.length : 0, nCancel: C.length,
      clientes: tels.length, recurrentes, recurrencia: tels.length ? recurrentes / tels.length : NaN,
      puntualidad: conHora.length ? aTiempo / conHora.length : NaN, porCobrar, ingTeorico,
      prods: Object.values(prods).sort((a, b) => b.v - a.v), dias, dow, franjas
    };
  };

  /* ---------- fechas comerciales en Colombia ---------- */
  function nDom(y, m, n, dow) { const d = new Date(y, m, 1); const add = (dow - d.getDay() + 7) % 7; return new Date(y, m, 1 + add + 7 * (n - 1)); }
  F.temporadas = () => {
    const y = new Date().getFullYear(), L = [];
    for (const yy of [y, y + 1]) L.push(
      { n: 'Día de la Madre', f: nDom(yy, 4, 2, 0), idea: 'tortas y desayunos sorpresa con reserva anticipada' },
      { n: 'Día del Padre', f: nDom(yy, 5, 3, 0), idea: 'desayunos y tortas para compartir' },
      { n: 'Amor y Amistad', f: nDom(yy, 8, 3, 6), idea: 'cajas de galletas y postres para regalar' },
      { n: 'Halloween', f: new Date(yy, 9, 31), idea: 'galletas y cupcakes decorados para niños' },
      { n: 'Novenas y Navidad', f: new Date(yy, 11, 16), idea: 'buñuelos, natilla, tortas navideñas y pedidos para empresas' },
      { n: 'Día de la Mujer', f: new Date(yy, 2, 8), idea: 'detalles dulces para empresas y oficinas' },
      { n: 'San Valentín', f: new Date(yy, 1, 14), idea: 'postres para dos y cajas de regalo' });
    const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    return L.map(t => ({ ...t, dias: Math.round((t.f - hoy) / 864e5) })).filter(t => t.dias >= 0 && t.dias <= 40).sort((a, b) => a.dias - b.dias);
  };

  /* ---------- memoria ---------- */
  F.memoriaVacia = () => ({ cierres: [], decisiones: [], cambiosPrecio: [], consejos: [] });
  F.snapshot = (D, ym) => {
    const c = F.calc(D, ym);
    return { mes: ym, fecha: Date.now(), ventas: Math.round(c.ventas), pedidos: c.pedidos, ticket: Math.round(c.ticket), mb: isFinite(c.mb) ? +c.mb.toFixed(3) : null, utilN: isFinite(c.utilN) ? Math.round(c.utilN) : null, pe: isFinite(c.pe) ? Math.round(c.pe) : null, cancel: +c.cancel.toFixed(3), recurrencia: isFinite(c.recurrencia) ? +c.recurrencia.toFixed(3) : null, puntualidad: isFinite(c.puntualidad) ? +c.puntualidad.toFixed(3) : null, top: c.prods.slice(0, 3).map(p => p.nombre) };
  };
  // Cierra automáticamente los meses anteriores que tengan pedidos y no estén guardados
  F.autoCierres = D => {
    const M = Object.assign(F.memoriaVacia(), D.memoria || {}); let cambio = false;
    const hoyM = PK.mes(PK.today());
    const meses = [...new Set(D.pedidos.map(p => PK.mes(p.fecha)))].filter(m => m < hoyM).sort().slice(-12);
    for (const m of meses) if (!M.cierres.some(c => c.mes === m)) { M.cierres.push(F.snapshot(D, m)); cambio = true; }
    M.cierres.sort((a, b) => a.mes.localeCompare(b.mes)); M.cierres = M.cierres.slice(-24);
    return cambio ? M : null;
  };
  F.registrarPrecio = (M, prod, antes, despues) => { M.cambiosPrecio.push({ fecha: PK.today(), id: prod.id, nombre: prod.nombre, antes: num(antes), despues: num(despues) }); M.cambiosPrecio = M.cambiosPrecio.slice(-100); };

  function unidadesSemana(D, id, desde, hasta) {
    let u = 0; D.pedidos.filter(p => p.estado === 'entregado' && p.fecha >= desde && p.fecha < hasta).forEach(p => (p.items || []).forEach(i => { if (i.id === id) u += num(i.cantidad); }));
    const dias = Math.max(1, (PK.parseISO(hasta) - PK.parseISO(desde)) / 864e5); return u / dias * 7;
  }

  /* ---------- el asesor ---------- */
  F.asesor = D => {
    const cfg = PK.cfg(D.config), meta = F.meta(D), M = Object.assign(F.memoriaVacia(), D.memoria || {});
    const ym = PK.mes(PK.today()), c = F.calc(D, ym), p = F.calc(D, F.mesAnterior(ym));
    const base = c.pedidos >= 8 ? c : p.pedidos >= 8 ? p : c; // si el mes va empezando, uso el anterior como referencia
    const A = []; const add = (id, prio, titulo, detalle, plazo, extra = {}) => A.push({ id, prio, titulo, detalle, plazo, ...extra });
    const r500 = n => PK.redondear(n, 500);

    if (c.pedidos + p.pedidos < 5) add('datos', 95, 'Registra unas semanas de pedidos', 'Todavía tengo muy pocos pedidos entregados para darte consejos con números. Marca los pedidos como «entregado» y registra tus recetas y gastos: con 2 o 3 semanas de datos ya puedo decirte qué subir, qué impulsar y qué revisar.', 'esta semana');

    // 1. Precios y márgenes por producto
    for (const pr of D.catalogo.filter(x => x.activo !== false)) {
      const m = F.margenProd(D, pr); if (!m) continue;
      if (m.margen < meta - 0.02) {
        const obj = r500(m.unit / (1 - meta)), paso = r500((num(pr.precio) + obj) / 2), vend = (base.prods.find(x => x.id === pr.id) || {}).u || 0;
        const ganExtra = (obj - num(pr.precio)) * vend;
        add('precio:' + pr.id, 70 + Math.min(20, (meta - m.margen) * 60) + Math.min(8, vend / 4), `Sube ${pr.nombre} a ${money(obj)}`,
          `Hacerla te cuesta ${money(m.unit)} y la vendes en ${money(pr.precio)}: te quedan ${money(num(pr.precio) - m.unit)} por unidad (margen ${pct(m.margen)}). Con ${money(obj)} llegas a tu meta del ${pct(meta)}.${vend ? ` Con las ${Math.round(vend)} unidades que vendiste ${base === c ? 'este mes' : 'el mes pasado'}, serían ${money(ganExtra)} más de ganancia.` : ''} Si te parece un salto grande, hazlo en dos pasos: ${money(paso)} ahora y ${money(obj)} en un mes.`, 'esta semana', { producto: pr.id, sugerido: obj });
      }
    }
    // 2. Producto estrella y productos débiles
    const conC = base.prods.filter(x => !x.sin && x.v > 0).map(x => ({ ...x, g: x.v - x.c, m: (x.v - x.c) / x.v }));
    if (conC.length >= 2) {
      const star = conC.slice().sort((a, b) => b.g - a.g)[0];
      add('estrella:' + star.id, 55, `Impulsa ${star.nombre}: es tu producto que más deja`, `Te dejó ${money(star.g)} de ganancia bruta (${pct(star.m)} de margen) con ${Math.round(star.u)} unidades. Ponlo de primero en el catálogo, súbelo a tus estados de WhatsApp dos veces por semana y ofrécelo en combo con algo de menor rotación.`, 'este mes');
      const totalV = conC.reduce((s, x) => s + x.v, 0);
      const debiles = conC.filter(x => x.v / totalV < 0.04 && x.m < meta - 0.1);
      if (debiles.length) add('debiles', 45, `Revisa ${debiles.map(x => x.nombre).join(', ')}`, `Venden poco (menos del 4% de tus ventas) y dejan poco margen. Ocupan tiempo de cocina e insumos que podrías dedicar a lo que más vende. Prueba subirles el precio, venderlos solo por encargo o sacarlos del menú por un mes y mira si alguien los extraña.`, 'este mes');
      const ord = conC.slice().sort((a, b) => b.v - a.v); let acc = 0, k = 0; for (const x of ord) { acc += x.v; k++; if (acc / totalV >= 0.8) break; }
      if (ord.length >= 5 && k / ord.length <= 0.3) add('pareto', 30, 'Pocos productos hacen casi todas tus ventas', `${k} de tus ${ord.length} productos generan el 80% de lo que vendes (${ord.slice(0, k).map(x => x.nombre).join(', ')}). Nunca te pueden faltar sus insumos: ten siempre stock de seguridad de lo que llevan.`, 'este mes');
    }
    const sinRec = D.catalogo.filter(x => x.activo !== false && !F.recetaDe(D, x));
    if (sinRec.length) add('sinreceta', 60, `Registra la receta de ${sinRec.length} producto(s)`, `No sé cuánto te cuesta hacer ${sinRec.slice(0, 4).map(x => x.nombre).join(', ')}${sinRec.length > 4 ? ' y otros' : ''}. Sin eso no puedo decirte si estás ganando o perdiendo con ellos.`, 'esta semana');
    const viejas = D.recetas.filter(r => r.actualizada && Date.now() - r.actualizada > 60 * 864e5);
    if (viejas.length) add('recetas60', 40, 'Actualiza el precio de los insumos', `Las recetas de ${viejas.map(r => r.nombre).join(', ')} no se actualizan hace más de 2 meses. Los insumos suben seguido (harina, huevos, mantequilla): revisa las facturas recientes y actualiza los precios de compra para que el costo sea real.`, 'este mes');

    // 3. Punto de equilibrio y utilidad
    if (isFinite(c.pe) && c.R.actual && c.R.trans >= 5) {
      if (c.proy < c.pe) {
        const gap = c.pe - c.proy, falt = c.R.dm - c.R.trans, ped = base.ticket ? Math.ceil(gap / base.ticket) : null;
        add('pe', 85, `Te faltan ${money(gap)} en ventas este mes`, `A este ritmo cerrarías el mes en ${money(c.proy)}, y para cubrir tus costos fijos (${money(c.fijosMes)}) necesitas vender ${money(c.pe)}. ${ped ? `Son unos ${ped} pedidos más en los ${falt} días que quedan (${(ped / Math.max(1, falt)).toFixed(1)} por día).` : ''} Lo más rápido: escribe a tus clientes frecuentes con una oferta de esta semana y ofrece un combo con tu producto estrella.`, 'esta semana');
      } else add('pe-ok', 20, 'Vas por encima del punto de equilibrio', `Proyectas ${money(c.proy)} y necesitas ${money(c.pe)}. Todo lo que vendas por encima de eso es ganancia: buen momento para separar un ahorro.`, 'este mes');
    }
    if (isFinite(c.utilN) && c.utilN > 0 && c.R.trans >= 10) add('ahorro', 25, `Separa ${money(r500(c.utilN * 0.1))} para un fondo de emergencia`, `Llevas ${money(c.utilN)} de utilidad estimada este mes. Guardar el 10% cada mes te protege cuando se dañe un horno o haya un mes flojo, sin tener que endeudarte.`, 'este mes');
    if (!F.fijos(D)) add('fijos', 80, 'Ingresa tus costos fijos', 'Arriendo, servicios, sueldos y pagos mensuales. Sin ellos no puedo calcular cuánto necesitas vender para no perder plata.', 'hoy');

    // 4. Tendencias
    if (p.pedidos >= 8 && c.R.trans >= 7) {
      const crec = (c.proy - p.ventas) / (p.ventas || 1);
      if (crec < -0.1) add('caida', 75, `Tus ventas van ${pct(-crec)} por debajo del mes pasado`, `El mes pasado vendiste ${money(p.ventas)} y este vas proyectando ${money(c.proy)}. Revisa si bajaron los pedidos (llevas ${c.pedidos} en ${c.R.trans} días; el mes pasado fueron ${p.pedidos} en total) o el ticket promedio (${money(c.ticket)} frente a ${money(p.ticket)}). Si bajó la cantidad de pedidos, reactiva clientes; si bajó el ticket, ofrece combos.`, 'esta semana');
      else if (crec > 0.1) add('crece', 22, `Vas creciendo ${pct(crec)} frente al mes pasado`, `Proyectas ${money(c.proy)} frente a ${money(p.ventas)}. Cuida que la cocina y los domicilios den abasto: revisa la puntualidad y no aceptes más pedidos por franja de los que puedes cumplir.`, 'este mes');
      if (p.ticket && c.ticket < p.ticket * 0.9) add('ticket', 50, 'Tus clientes están comprando menos por pedido', `El ticket promedio bajó de ${money(p.ticket)} a ${money(c.ticket)}. Ofrece «agrega 4 croissants por $X» al confirmar, o domicilio gratis desde ${money(r500(p.ticket * 1.2))}.`, 'esta semana');
    }
    // 5. Domicilios
    if (base.nDom >= 5 && base.costoDom > base.domCob * 1.05) add('domicilios', 58, 'Estás poniendo plata en los domicilios', `Le pagas al domiciliario ${money(base.costoDom)} y cobraste ${money(base.domCob)} en domicilios: pierdes ${money(base.costoDom - base.domCob)} al mes. Sube la tarifa de las distancias cortas o define un pedido mínimo para domicilio.`, 'esta semana');
    // 6. Clientes y operación
    if (isFinite(base.recurrencia) && base.clientes >= 8 && base.recurrencia < 0.3) add('fidelidad', 48, 'Pocos clientes te vuelven a comprar', `Solo el ${pct(base.recurrencia)} de tus clientes repitió. Una tarjeta de sellos («a la 6.ª compra, un postre gratis») o un mensaje de WhatsApp a los 15 días de su pedido suele subir mucho la recompra, y es más barato que conseguir clientes nuevos.`, 'este mes');
    if (base.cancel > 0.08 && base.pedidos >= 8) add('cancel', 62, `Se te están cancelando el ${pct(base.cancel)} de los pedidos`, 'Pide un abono del 50% para tortas y pedidos grandes antes de empezar a prepararlos, y confirma por WhatsApp el día anterior.', 'esta semana');
    if (isFinite(base.puntualidad) && base.puntualidad < 0.9) add('puntual', 57, `Solo el ${pct(base.puntualidad)} de los domicilios llegan a tiempo`, 'Usa «Calcular rutas» cada mañana y respeta la hora de salida de cada viaje. Si siempre se te cruzan, baja los cupos de las franjas más llenas o suma un repartidor esas horas.', 'esta semana');
    if (c.porCobrar > 0) add('cobrar', c.porCobrar > base.ticket * 3 ? 66 : 35, `Tienes ${money(c.porCobrar)} por cobrar`, 'Son pedidos entregados que no están marcados como pagados. Revisa los comprobantes y cobra lo pendiente antes de fin de mes.', 'hoy');
    // 7. Merma / desperdicio
    if (base.ingTeorico > 0 && base.insumos > 0 && base.R.trans >= 14) {
      const ratio = base.insumos / base.ingTeorico;
      if (ratio > 1.25) add('merma', 52, `Compraste ${pct(ratio - 1)} más insumos de lo que dicen tus recetas`, `Según lo que vendiste, tus recetas usan ${money(base.ingTeorico)} en ingredientes, pero compraste ${money(base.insumos)}. La diferencia puede ser desperdicio, producto que no se vendió, recetas con cantidades desactualizadas o insumos que quedaron en inventario. Lleva una lista de lo que se bota cada día durante una semana.`, 'este mes');
    }
    // 8. Días fuertes y débiles
    const dv = base.dow.map((v, i) => ({ i, v })).filter(x => (cfg.dias || []).includes(x.i));
    if (dv.length >= 4 && base.pedidos >= 10) {
      const s = dv.slice().sort((a, b) => b.v - a.v), N = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
      if (s[0].v > s[s.length - 1].v * 2.5) add('dias', 32, `El ${N[s[s.length - 1].i]} es tu día más flojo`, `El ${N[s[0].i]} vendes ${money(s[0].v)} y el ${N[s[s.length - 1].i]} apenas ${money(s[s.length - 1].v)}. Haz una promoción solo para ese día (por ejemplo «${N[s[s.length - 1].i]} de pan de bono 2x1») y produce menos para no tener sobrantes.`, 'este mes');
    }
    // 9. Temporadas
    for (const t of F.temporadas()) add('temp:' + t.n, 60 - t.dias / 2, `Prepara ${t.n} (faltan ${t.dias} días)`, `Es una de las fechas que más venden en pastelería en Colombia. Arma desde ya ${t.idea}, publícalo con fotos en tu catálogo y abre pedidos anticipados con abono para planear la producción.`, t.dias <= 10 ? 'esta semana' : 'este mes');

    // 10. Memoria: qué pasó con los cambios de precio
    const recuerdos = [];
    for (const cp of M.cambiosPrecio.slice(-6).reverse()) {
      const dias = (Date.now() - PK.parseISO(cp.fecha)) / 864e5; if (dias < 7 || dias > 120) continue;
      const antesU = unidadesSemana(D, cp.id, PK.addDays(cp.fecha, -28), cp.fecha), despU = unidadesSemana(D, cp.id, cp.fecha, PK.today());
      const pr = D.catalogo.find(x => x.id === cp.id), m = pr && F.margenProd(D, pr); const u = m ? m.unit : 0;
      const gA = antesU * (cp.antes - u), gD = despU * (cp.despues - u);
      recuerdos.push(`El ${PK.fdate(cp.fecha, { day: 'numeric', month: 'long' })} cambiaste ${cp.nombre} de ${money(cp.antes)} a ${money(cp.despues)}. Antes vendías ${antesU.toFixed(1)} por semana y ahora ${despU.toFixed(1)}.${u ? ` La ganancia semanal con ese producto pasó de ${money(gA)} a ${money(gD)}: ${gD >= gA ? 'el cambio te está funcionando.' : 'estás ganando menos; considera una promoción o volver a un precio intermedio.'}` : ''}`);
    }
    // consejos que se repiten
    for (const a of A) { const prev = M.consejos.filter(x => x.id === a.id).sort((x, y) => x.fecha - y.fecha)[0]; if (prev && Date.now() - prev.fecha > 20 * 864e5) { a.pendienteDesde = prev.fecha; a.prio += 5; } }
    // comparación con meses guardados
    const ult = M.cierres.slice(-3);
    if (ult.length >= 2) { const a = ult[ult.length - 2], b = ult[ult.length - 1]; recuerdos.unshift(`En ${PK.mesNombre(b.mes)} vendiste ${money(b.ventas)} (${b.ventas >= a.ventas ? '+' : ''}${pct((b.ventas - a.ventas) / (a.ventas || 1))} frente a ${PK.mesNombre(a.mes)}), con ${b.pedidos} pedidos y margen bruto de ${b.mb != null ? pct(b.mb) : '—'}.`); }
    for (const d of M.decisiones.slice(-3).reverse()) recuerdos.push(`Decidiste el ${PK.fdate(d.fecha, { day: 'numeric', month: 'long' })}: «${d.texto}».`);

    // semáforo y rumbo
    const mbx = isFinite(base.mb) ? base.mb : NaN, un = isFinite(c.utilN) ? c.utilN : NaN;
    let sem = 'amarillo';
    if (isFinite(mbx) && mbx >= meta - 0.05 && (!isFinite(c.pe) || c.proy >= c.pe)) sem = 'verde';
    else if ((isFinite(mbx) && mbx < meta - 0.15) || (isFinite(c.pe) && c.R.trans >= 10 && c.proy < c.pe * 0.8)) sem = 'rojo';
    let rumbo;
    if (isFinite(mbx) && mbx < meta - 0.1) rumbo = { t: 'Proteger el margen', d: `Antes de vender más, asegúrate de ganar lo justo en cada producto. Hoy tu margen bruto es ${pct(mbx)} y tu meta es ${pct(meta)}: vender más con márgenes bajos solo te da más trabajo. Ajusta precios de los productos marcados y revisa costos de insumos; en 4 a 6 semanas deberías ver el margen arriba de ${pct(meta - 0.05)}.` };
    else if (isFinite(c.pe) && c.proy < c.pe) rumbo = { t: 'Vender más con lo que ya tienes', d: `Tus precios están bien, el reto es el volumen: te faltan ${money(c.pe - c.proy)} al mes para cubrir costos fijos. Enfócate en recompra de clientes actuales, combos con tu producto estrella y fechas especiales, antes de invertir en productos nuevos.` };
    else if ((isFinite(base.puntualidad) && base.puntualidad < 0.9) || base.cancel > 0.08) rumbo = { t: 'Ordenar la operación', d: 'El negocio gana plata, pero la operación está perdiendo clientes (entregas tarde o cancelaciones). Estandariza horarios de producción, respeta las rutas y pide abonos; eso protege lo que ya construiste.' };
    else rumbo = { t: 'Crecer con cabeza', d: 'Los números están sanos. Es momento de crecer: pedidos para empresas y eventos, nuevas presentaciones de tus productos estrella y fechas especiales. Crece sin bajar el margen y separa un ahorro cada mes.' };
    const diag = sem === 'verde' ? `Vas bien: ${isFinite(mbx) ? `margen bruto de ${pct(mbx)}` : 'sin alertas graves'}${isFinite(c.pe) ? ` y proyectas ${money(c.proy)} frente a ${money(c.pe)} necesarios` : ''}.` : sem === 'rojo' ? `Hay que actuar: ${isFinite(mbx) && mbx < meta - 0.15 ? `tu margen bruto (${pct(mbx)}) está muy por debajo de tu meta (${pct(meta)})` : `las ventas proyectadas (${money(c.proy)}) no alcanzan a cubrir los costos (${money(c.pe)})`}.` : `Estás a mitad de camino${isFinite(mbx) ? `: margen bruto de ${pct(mbx)} frente a una meta de ${pct(meta)}` : ''}. Con unos ajustes puedes llegar.`;

    A.sort((a, b) => b.prio - a.prio);
    return { sem, diag, rumbo, acciones: A.slice(0, 8), recuerdos, c, p };
  };
})();

  const clienteLink = () => PK.nube.activo ? PK.nube.enlaces().cliente : new URL('index.html', location.href).href.replace(/#.*$/, '');
  const rutaLink = () => PK.nube.activo ? PK.nube.enlaces().repartidor : new URL('ruta.html', location.href).href.replace(/#.*$/, '');

  function enlacesHTML() {
    const E = PK.nube.enlaces(), reps = (cfgS().repartidores || []).filter(r => r.tel);
    const fila = (t, d, v, extra = '') => `<div class="tip"><span class="dot ok"></span><div><b>${t}</b><p class="small mut">${d}</p><input readonly value="${esc(v)}"><div class="row" style="margin-top:6px"><button class="btn s" data-a="copiarV" data-v="${esc(v)}">Copiar</button>${extra}</div></div></div>`;
    return fila('Link para clientes', 'Ponlo en tu perfil de WhatsApp Business, en el mensaje de bienvenida y en tus redes.', E.cliente, `<button class="btn g s" data-a="copiarV" data-v="${esc(msjBienvenida())}">Copiar mensaje de bienvenida</button><a class="btn g s" href="${esc(E.cliente)}" target="_blank" rel="noopener">Probar</a>`)
      + fila('Link «Salir a ruta» para el repartidor', 'Envíaselo por WhatsApp. Solo tiene que abrirlo una vez en su celular.', E.repartidor, reps.map(r => `<a class="btn g s" target="_blank" rel="noopener" href="${esc(PK.waLink(r.tel, `Hola ${r.nombre}, este es tu link de rutas de ${cfgS().nombre}. Ábrelo y guárdalo en la pantalla de inicio: ${E.repartidor}`))}">Enviar a ${esc(r.nombre)}</a>`).join(''))
      + fila('Link de tu panel (¡guárdalo!)', 'Es la llave de tu negocio: con él abres el panel en otro celular o lo recuperas si cambias de teléfono. Envíatelo a ti misma por WhatsApp o guárdalo en Notas. No lo compartas.', E.panel);
  }
  function asistente() {
    main.innerHTML = `<div class="card" style="max-width:680px;margin:0 auto"><h2>Configura Ponkezza</h2><p class="mut">Una sola vez, desde este celular. Sigue la guía «Instalación desde el iPhone»: ahí está cómo conseguir cada enlace.</p>
    <label for="w-form">1. Enlace prellenado de tu formulario de Google</label><textarea id="w-form" style="min-height:70px" placeholder="https://docs.google.com/forms/d/e/…/viewform?usp=pp_url&entry.123456=x"></textarea>
    <label for="w-hoja">2. Enlace de la hoja de respuestas</label><input id="w-hoja" placeholder="https://docs.google.com/spreadsheets/d/…">
    <label for="w-wa">3. WhatsApp de Ponkezza</label><input id="w-wa" inputmode="tel" placeholder="300 123 4567">
    <label for="w-nom">Nombre del negocio</label><input id="w-nom" value="Ponkezza">
    <button class="btn w" data-a="wConfig" style="margin-top:14px">Conectar</button><div id="w-msg" style="margin-top:12px"></div>
    <p class="small mut" style="margin-top:18px">¿Ya lo configuraste en otro celular? Abre en este el «link de tu panel» que guardaste y quedará conectado.</p>
    <button class="btn g w" data-a="wDemo">Ver una demostración con datos de ejemplo</button></div>`;
  }
  async function verificarConexion(msg) {
    msg.innerHTML = '<p><span class="spin"></span> Comprobando que la hoja recibe los datos…</p>';
    for (let i = 0; i < 4; i++) { await new Promise(r => setTimeout(r, 3500)); try { if (await PK.nube.verificar()) { msg.innerHTML = `<p class="chip ok">¡Conectado!</p><p>Tu Ponkezza ya funciona. Estos son tus links:</p>${enlacesHTML()}<button class="btn w" data-a="wListo" style="margin-top:12px">Ir al panel</button>`; return; } } catch (e) { var err = e.message; } }
    msg.innerHTML = `<p style="color:var(--bad)">Ya envié la configuración, pero todavía no puedo leer la hoja${err ? ' (' + esc(err) + ')' : ''}.</p><p class="small">Revisa: la hoja debe estar compartida como <b>Cualquier persona con el enlace · Lector</b>, y el formulario debe estar vinculado a esa misma hoja.</p><div class="row"><button class="btn" data-a="wVerif">Probar otra vez</button><button class="btn g" data-a="wListo">Continuar de todos modos</button></div>`;
  }
  function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2800); }
  async function copiar(t) { try { await navigator.clipboard.writeText(t); toast('Copiado'); } catch (e) { abrir(`<h3>Copia este texto</h3><textarea style="min-height:240px">${esc(t)}</textarea><div class="row" style="margin-top:10px"><button class="btn" data-a="cerrar">Cerrar</button></div>`); } }
  const abrir = h => { $('#sheet').innerHTML = h; $('#ov').hidden = false; };
  const cerrar = () => { $('#ov').hidden = true; $('#sheet').innerHTML = ''; ED = null; };
  const COL = { pedido: 'pedidos', producto: 'catalogo', receta: 'recetas', gasto: 'gastos' };
  function local(tipo, obj, borrar) {
    if (tipo === 'config') D.config = obj; else if (tipo === 'memoria') D.memoria = obj;
    else { const a = D[COL[tipo]], i = a.findIndex(x => x.id === obj.id); if (borrar) { if (i >= 0) a.splice(i, 1); } else if (i >= 0) a[i] = obj; else a.push(obj); }
  }
  async function guardar(tipo, obj, silencio) { local(tipo, obj); render(); try { await PK.store.guardar(tipo, obj, CLAVE); if (!silencio) toast('Guardado'); } catch (e) { toast('No se pudo guardar: ' + e.message); } }
  async function guardarVarios(tipo, objs) { objs.forEach(o => local(tipo, o)); render(); try { await PK.store.guardarVarios(tipo, objs, CLAVE); toast('Guardado'); } catch (e) { toast('No se pudo guardar: ' + e.message); } }
  async function borrar(tipo, obj) { local(tipo, obj, true); render(); try { await PK.store.borrar(tipo, obj.id, CLAVE); toast('Eliminado'); } catch (e) { toast('No se pudo eliminar: ' + e.message); } }
  const chipE = e => `<span class="chip ${e === 'entregado' ? 'ok' : e === 'cancelado' ? 'b' : e === 'en camino' || e === 'listo' ? 'w' : ''}">${esc(e || 'nuevo')}</span>`;
  const frTxt = p => p.franjaIni ? `${p.franjaIni}–${p.franjaFin}` : 'sin hora';
  const itemsTxt = p => (p.items || []).map(i => i.cantidad + ' × ' + i.nombre).join(', ');
  const sigE = e => { const i = ESTADOS.indexOf(e || 'nuevo'); return i >= 0 && i < 4 ? ESTADOS[i + 1] : null; };
  const kpi = (v, l, hi) => `<div class="kpi ${hi ? 'hi' : ''}"><b title="${esc(v)}">${esc(v)}</b><span>${esc(l)}</span></div>`;
  const foto = p => PK.fotoOk(p.foto) ? `<img src="${esc(p.foto)}" alt="" loading="lazy">` : PK.placeholder(p.nombre);

  /* ---------------- carga y sesión ---------------- */
  async function cargar(silencio) {
    try {
      const d = await PK.store.todo(CLAVE);
      const antes = D ? new Set(D.pedidos.map(p => p.id)) : null;
      D = { config: d.config || {}, catalogo: d.catalogo || [], pedidos: d.pedidos || [], recetas: d.recetas || [], gastos: d.gastos || [], memoria: Object.assign(PK.fin.memoriaVacia(), d.memoria || {}) };
      if (antes) { const nuevos = D.pedidos.filter(p => !antes.has(p.id)); if (nuevos.length) { toast(`Llegaron ${nuevos.length} pedido(s) nuevos`); document.title = `(${nuevos.length}) Ponkezza · Panel`; } }
      const m = PK.fin.autoCierres(D); if (m) { D.memoria = m; PK.store.guardar('memoria', m, CLAVE).catch(() => {}); }
      $('#bn').textContent = cfg().nombre;
      render(!silencio);
    } catch (e) {
      if (/clave/i.test(e.message)) return login(e.message);
      if (!silencio) main.innerHTML = `<div class="card"><h3>No se pudo cargar la información</h3><p>${esc(e.message)}</p><button class="btn" data-a="recargar">Intentar de nuevo</button></div>`;
    }
  }

  /* ---------------- render ---------------- */
  let enEdicion = false;
  function render(forzar) {
    if (!D) return;
    const v = view();
    document.querySelectorAll('#tabs a').forEach(a => a.toggleAttribute('aria-current', a.hash === '#' + v));
    const nn = D.pedidos.filter(p => p.estado === 'nuevo').length; $('#nn').hidden = !nn; $('#nn').textContent = nn;
    if (!forzar && enEdicion && ['ajustes', 'recetas'].includes(v)) return;
    const V = { hoy: vHoy, pedidos: vPedidos, rutas: vRutas, catalogo: vCatalogo, recetas: vRecetas, gastos: vGastos, finanzas: vFinanzas, consejos: vConsejos, ajustes: vAjustes };
    main.innerHTML = V[v]();
    enEdicion = ['ajustes', 'recetas'].includes(v);
    if (v === 'rutas') pintarMapa();
    if (v === 'recetas') pintarReceta();
    if (v === 'consejos') registrarConsejos();
  }

  /* ---------------- HOY ---------------- */
  function produccion(ps) { const m = {}; ps.filter(p => !['entregado', 'cancelado'].includes(p.estado)).forEach(p => (p.items || []).forEach(i => { m[i.nombre] = (m[i.nombre] || 0) + num(i.cantidad); })); return Object.entries(m).sort((a, b) => b[1] - a[1]); }
  function vHoy() {
    const t = PK.today(), m = PK.addDays(t, 1), ps = D.pedidos.filter(p => p.fecha === t && p.estado !== 'cancelado').sort((a, b) => frTxt(a).localeCompare(frTxt(b)));
    const pend = ps.filter(p => p.estado !== 'entregado'), c = PK.fin.calc(D, PK.mes(t)), a = PK.fin.asesor(D);
    const prodH = produccion(ps), prodM = produccion(D.pedidos.filter(p => p.fecha === m));
    const link = clienteLink();
    return `<div class="head"><div><h2>Hoy, ${esc(PK.fdate(t))}</h2><p class="mut">${pend.length ? `${pend.length} pedido(s) por entregar.` : 'No hay entregas pendientes para hoy.'}</p></div><div class="row"><a class="btn" href="#rutas">Ver rutas de hoy</a><button class="btn g" data-a="nuevoPed">Nuevo pedido</button></div></div>
    <div class="kpis">${kpi(ps.length, 'pedidos para hoy', 1)}${kpi(pend.length, 'por entregar')}${kpi(money(ps.filter(p => !p.pagado).reduce((s, p) => s + num(p.total), 0)), 'por cobrar hoy')}${kpi(money(c.ventas), 'vendido este mes')}${kpi(pct(c.mb), 'margen bruto del mes')}</div>
    <div class="grid2"><div class="card"><h3>Pedidos de hoy</h3>${ps.length ? ps.map(p => `<div class="stop"><div class="t">${esc(p.franjaIni || '—')}<small>${esc(p.numero)}</small></div><div><b>${esc(p.cliente)}</b> ${chipE(p.estado)} ${p.pagado ? '<span class="chip ok">pagado</span>' : ''}<br><span class="small">${esc(itemsTxt(p))}</span><br><span class="small mut">${p.tipoEntrega === 'recoger' ? 'Recoge en el local' : esc(p.direccion + (p.barrio ? ' · ' + p.barrio : ''))}${p.ruta && p.ruta.eta ? ' · llega ' + esc(p.ruta.eta) : ''}</span></div><div class="acts">${sigE(p.estado) ? `<button class="btn s" data-a="sig" data-id="${esc(p.id)}">${esc(sigE(p.estado))}</button>` : ''}<button class="btn g s" data-a="abrirPed" data-id="${esc(p.id)}">Abrir</button></div></div>`).join('') : '<div class="empty">Sin pedidos para hoy.</div>'}</div>
    <div><div class="card"><h3>Para producir</h3><p class="small mut">Pendiente de hoy</p>${prodH.length ? `<table><tbody>${prodH.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="r"><b>${v}</b></td></tr>`).join('')}</tbody></table>` : '<p class="mut">Nada pendiente.</p>'}<p class="small mut" style="margin-top:12px">Para mañana</p>${prodM.length ? `<table><tbody>${prodM.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="r"><b>${v}</b></td></tr>`).join('')}</tbody></table>` : '<p class="mut">Aún no hay pedidos.</p>'}</div>
    <div class="card" style="margin-top:16px"><div class="sem"><span class="luz ${a.sem}"></span><div><h3>${esc(a.rumbo.t)}</h3><p class="small">${esc(a.diag)}</p></div></div>${a.acciones.slice(0, 2).map(x => `<div class="tip"><span class="dot ${x.prio > 70 ? '' : 'w'}"></span><div><b>${esc(x.titulo)}</b></div></div>`).join('')}<p><a href="#consejos">Ver todos los consejos</a></p></div>
    <div class="card" style="margin-top:16px"><h3>Link de pedidos para WhatsApp</h3><p class="small mut">Ponlo en tu perfil de WhatsApp Business, en el mensaje de bienvenida y en tus redes.</p><input readonly value="${esc(link)}"><div class="row" style="margin-top:8px"><button class="btn s" data-a="copiarLink">Copiar link</button><button class="btn g s" data-a="copiarMsjLink">Copiar mensaje de bienvenida</button><a class="btn g s" href="${esc(link)}" target="_blank" rel="noopener">Abrir</a></div><div class="row" style="margin-top:10px"><button class="btn g s" data-a="copiarV" data-v="${esc(rutaLink())}">Copiar link «Salir a ruta» del repartidor</button></div></div></div></div>`;
  }

  /* ---------------- PEDIDOS ---------------- */
  function filtrarPedidos() {
    const t = PK.today(); let ps = D.pedidos.slice();
    if (F.rango === 'hoy') ps = ps.filter(p => p.fecha === t); else if (F.rango === 'manana') ps = ps.filter(p => p.fecha === PK.addDays(t, 1));
    else if (F.rango === 'semana') ps = ps.filter(p => p.fecha >= t && p.fecha <= PK.addDays(t, 7)); else if (F.rango === 'mes') ps = ps.filter(p => p.fecha >= PK.addDays(t, -30) && p.fecha <= t);
    else if (F.rango === 'nuevos') ps = ps.filter(p => p.estado === 'nuevo');
    if (F.estado) ps = ps.filter(p => p.estado === F.estado);
    if (F.q) { const q = norm(F.q); ps = ps.filter(p => norm([p.numero, p.cliente, p.telefono, p.barrio, itemsTxt(p)].join(' ')).includes(q)); }
    return ps.sort((a, b) => (b.fecha + frTxt(b)).localeCompare(a.fecha + frTxt(a))).slice(0, 300);
  }
  function vPedidos() {
    const ps = filtrarPedidos();
    return `<div class="head"><div><h2>Pedidos</h2><p class="mut">Los pedidos de la página llegan aquí solos${PK.demo ? '' : ' (se actualiza cada minuto)'}.</p></div><div class="row"><button class="btn" data-a="nuevoPed">Nuevo pedido</button><button class="btn g" data-a="pegarPed">Pegar pedido de WhatsApp</button></div></div>
    <div class="card"><div class="row" style="margin-bottom:8px"><select id="fr" style="width:auto">${[['hoy', 'Hoy'], ['manana', 'Mañana'], ['semana', 'Próximos 7 días'], ['nuevos', 'Sin atender (nuevos)'], ['mes', 'Últimos 30 días'], ['todos', 'Todos']].map(([v, l]) => `<option value="${v}" ${F.rango === v ? 'selected' : ''}>${l}</option>`).join('')}</select><select id="fe" style="width:auto"><option value="">Todos los estados</option>${ESTADOS.map(e => `<option ${F.estado === e ? 'selected' : ''}>${e}</option>`).join('')}</select><input id="fq" placeholder="Buscar cliente, número o producto" value="${esc(F.q)}" style="width:260px"></div>
    ${ps.length ? `<table class="stack"><thead><tr><th>Pedido</th><th>Entrega</th><th>Cliente</th><th>Productos</th><th class="r">Total</th><th>Estado</th><th></th></tr></thead><tbody>${ps.map(p => `<tr><td><b>${esc(p.numero)}</b><br><span class="small mut">${esc(p.canal || '')}</span></td><td class="nowrap">${esc(PK.fdate(p.fecha, { weekday: 'short', day: 'numeric', month: 'short' }))}<br>${esc(frTxt(p))}</td><td>${esc(p.cliente)}<br><span class="small mut">${esc(p.telefono)} · ${p.tipoEntrega === 'recoger' ? 'recoge' : esc(p.barrio || 'domicilio')}</span></td><td>${esc(itemsTxt(p))}</td><td class="r">${money(p.total)}<br>${p.pagado ? '<span class="chip ok">pagado</span>' : '<span class="chip w">por cobrar</span>'}</td><td>${chipE(p.estado)}</td><td><div class="row" style="justify-content:end">${sigE(p.estado) ? `<button class="btn s" data-a="sig" data-id="${esc(p.id)}">${esc(sigE(p.estado))}</button>` : ''}<button class="btn g s" data-a="abrirPed" data-id="${esc(p.id)}">Abrir</button></div></td></tr>`).join('')}</tbody></table>` : '<div class="empty">No hay pedidos con estos filtros.</div>'}</div>`;
  }
  function nuevoPedido() { const c = cfg(); return { id: PK.uid(), numero: 'PK-M' + String(Date.now()).slice(-5), creado: Date.now(), canal: 'manual', estado: 'nuevo', pagado: false, cliente: '', telefono: '', tipoEntrega: 'domicilio', direccion: '', barrio: '', referencia: '', lat: null, lng: null, km: null, fecha: PK.today(), franja: (c.franjas[0] || {}).id || '', franjaIni: '', franjaFin: '', items: [{ id: '', nombre: '', precio: 0, cantidad: 1 }], subtotal: 0, domicilio: num(c.domicilioSinUbicacion), total: 0, pago: c.pagos[0] || '', notas: '' }; }
  function editorPedido(p) {

  function leerPedido() {
    for (const k of ['cliente', 'telefono', 'tipoEntrega', 'direccion', 'barrio', 'fecha', 'franja', 'pago', 'estado', 'notas']) ED[k] = $('#o-' + k).value.trim();

    const fr = PK.franjaPorId(cfg(), ED.franja) || {}; ED.franjaIni = fr.ini || ''; ED.franjaFin = fr.fin || '';
    ED.items = ED.items.filter(i => i.id || i.nombre);
    ED.subtotal = ED.items.reduce((s, i) => s + num(i.precio) * num(i.cantidad), 0);
    if (ED.tipoEntrega === 'recoger') ED.domicilio = 0;
    ED.total = ED.subtotal + num(ED.domicilio);
    ED.km = ED.lat != null ? Math.round(PK.km(cfg().base, ED) * 10) / 10 : null;

  function parsearPedido(txt) {
    const c = cfg(), L = String(txt).split(/\n/).map(x => x.trim()), get = k => { const l = L.find(x => x.toLowerCase().startsWith(k.toLowerCase() + ':')); return l ? l.slice(k.length + 1).trim() : ''; };
    const p = nuevoPedido(); p.canal = 'whatsapp';
    const nm = (L.find(x => /^PEDIDO\s/i.test(x)) || '').match(/PEDIDO\s+(\S+)/i); if (nm && nm[1] !== 'NUEVO') p.numero = nm[1];
    const cl = get('Cliente').split('·').map(s => s.trim()); p.cliente = cl[0] || ''; p.telefono = PK.telNorm(cl[1] || '');
    const en = get('Entrega').split('·').map(s => s.trim()); if (/recoge/i.test(en[0] || '')) p.tipoEntrega = 'recoger'; else { p.direccion = en[1] || ''; p.barrio = en[2] || ''; }
    const co = PK.coordsDeTexto(get('Ubicación')); if (co) { p.lat = co.lat; p.lng = co.lng; }
    const fe = get('Fecha').match(/(\d{4}-\d{2}-\d{2})\s*·\s*(\d{2}:\d{2})/); if (fe) { p.fecha = fe[1]; const fr = c.franjas.find(x => x.ini === fe[2]); if (fr) p.franja = fr.id; }
    p.items = L.filter(x => /^-\s*\d+\s*x\s+/i.test(x)).map(x => { const m = x.match(/^-\s*(\d+)\s*x\s+(.+?)\s*(?:\(\$?([\d.,]+)\))?$/i); const pr = D.catalogo.find(q => norm(q.nombre) === norm(m[2])); const q = +m[1]; return { id: pr ? pr.id : '', nombre: pr ? pr.nombre : m[2], cantidad: q, precio: pr ? num(pr.precio) : Math.round(num(m[3]) / q) }; });
    if (!p.items.length) p.items = [{ id: '', nombre: '', precio: 0, cantidad: 1 }];
    p.domicilio = num(get('Domicilio')); p.pago = get('Pago') || p.pago; p.notas = get('Notas');
    return p;
  }

  function leerAjustes() {
    const c = JSON.parse(JSON.stringify(cfg()));
    document.querySelectorAll('[data-c]').forEach(el => { c[el.dataset.c] = el.value.trim(); });
    for (const k of ['anticipacionHoras', 'pedidoMinimo', 'maxKm', 'domicilioSinUbicacion', 'domicilioGratisDesde', 'costoPorEntrega', 'capacidadViaje', 'minutosParada', 'minutosCarga', 'velocidad', 'factorTrafico', 'metaMargen']) c[k] = num(c[k]);

    c.dias = [...document.querySelectorAll('#dias input:checked')].map(i => +i.value);
    const co = PK.coordsDeTexto($('#c-lat').value);
    c.base = { direccion: $('#c-dir').value.trim(), lat: co ? co.lat : num($('#c-lat').value), lng: co ? co.lng : num($('#c-lng').value) };
    const filas = id => [...document.querySelectorAll('#' + id + ' tbody tr')].map(tr => { const o = {}; tr.querySelectorAll('[data-k]').forEach(i => { o[i.dataset.k] = i.type === 'checkbox' ? i.checked : i.value.trim(); }); return o; });
    c.franjas = filas('franjas').filter(f => f.ini && f.fin).map((f, i) => ({ id: (cfg().franjas[i] && cfg().franjas[i].ini === f.ini) ? cfg().franjas[i].id : 'f' + PK.uid().slice(-5), ini: f.ini, fin: f.fin, cupo: num(f.cupo) })).sort((a, b) => a.ini.localeCompare(b.ini));
    c.tarifas = filas('tarifas').filter(t => num(t.hasta)).map(t => ({ hasta: num(t.hasta), valor: num(t.valor) }));
    c.repartidores = filas('reps').filter(r => r.nombre).map((r, i) => ({ id: (cfg().repartidores[i] || {}).id || 'r' + PK.uid().slice(-5), nombre: r.nombre, tel: r.tel, inicio: r.inicio || '08:00', fin: r.fin || '18:00', activo: r.activo !== false }));
    c.costosFijos = filas('fijos').filter(f => f.concepto).map(f => ({ concepto: f.concepto, valor: num(f.valor) }));
    c.faq = Object.assign({}, c.faq); document.querySelectorAll('[data-q]').forEach(el => { c.faq[el.dataset.q] = el.value.trim(); });
    return c;
  }

  /* ---------------- acciones ---------------- */
  const A = {
    cerrar, recargar: () => cargar(),
    copiarLink: () => copiar(clienteLink()),
    copiarMsjLink: () => copiar(msjBienvenida()),
    copiarV: (id, b) => copiar(b.dataset.v),
    wDemo: () => { PK.demo = true; arrancar(); },
    wConfig: async (id, b) => {
      const form = PK.nube.parseForm($('#w-form').value), hoja = PK.nube.parseHoja($('#w-hoja').value), wa = $('#w-wa').value.replace(/\D/g, ''), msg = $('#w-msg');
      if (!form) { msg.innerHTML = '<p style="color:var(--bad)">El enlace del formulario debe ser el <b>enlace prellenado</b>: empieza con docs.google.com/forms/d/e/ y contiene «entry.».</p>'; return; }
      if (!hoja) { msg.innerHTML = '<p style="color:var(--bad)">El enlace de la hoja debe empezar con docs.google.com/spreadsheets/d/.</p>'; return; }
      if (wa.length < 10) { msg.innerHTML = '<p style="color:var(--bad)">Escribe el WhatsApp con sus 10 dígitos.</p>'; return; }
      b.disabled = true; b.innerHTML = '<span class="spin"></span> Conectando…';
      try { await PK.nube.configurar({ form, hoja, wa: wa.length === 10 ? '57' + wa : wa, nombre: $('#w-nom').value.trim() }); b.style.display = 'none'; await verificarConexion(msg); }
      catch (e) { b.disabled = false; b.textContent = 'Conectar'; msg.innerHTML = `<p style="color:var(--bad)">No se pudo conectar: ${esc(e.message)}</p>`; }
    },
    wVerif: () => verificarConexion($('#w-msg')),
    wListo: () => arrancar(),
    guardarWa: async () => { let w = $('#c-wa').value.replace(/\D/g, ''); if (w.length === 10) w = '57' + w; if (w.length < 11) return toast('Número no válido'); await PK.nube.cambiarWhatsApp(w); toast('Número guardado'); },
    salirNube: (id, b) => { if (!b.dataset.ok) { b.dataset.ok = 1; b.textContent = '¿Seguro? Guarda antes el link de tu panel. Toca otra vez'; return; } PK.nube.salir(); },
    nuevoPed: () => editorPedido(nuevoPedido()),
    abrirPed: id => editorPedido(D.pedidos.find(p => p.id === id)),
    pegarPed: () => abrir(`<div class="row" style="justify-content:space-between"><h3>Pegar pedido de WhatsApp</h3><button class="btn g s" data-a="cerrar">Cerrar</button></div><p class="small mut">Pega el mensaje de confirmación que te envió el cliente desde la página.</p><textarea id="pt" style="min-height:220px"></textarea><button class="btn" data-a="leerPegado" style="margin-top:10px">Leer pedido</button>`),
    leerPegado: () => { const p = parsearPedido($('#pt').value); editorPedido(p); },
    addItem: () => { leerPedido(); ED.items.push({ id: '', nombre: '', precio: 0, cantidad: 1 }); pintarItems(); },
    rmItem: id => { ED.items.splice(+id, 1); pintarItems(); },
    calcDom: () => { leerPedido(); const c = cfg(); if (ED.lat == null) { toast('Primero pega la ubicación del cliente'); return; } const t = PK.tarifa(c, PK.km(c.base, ED), ED.subtotal); $('#o-domicilio').value = t.fuera ? 0 : t.valor; toast(t.fuera ? 'Fuera de cobertura' : `${ED.km} km: ${money(t.valor)}`); totPed(); },
    guardarPed: async () => { leerPedido(); if (!ED.cliente) { $('#o-cliente').focus(); return; } const o = ED; cerrar(); await guardar('pedido', o); },
    borrarPed: (id, b) => { if (!b.dataset.ok) { b.dataset.ok = 1; b.textContent = 'Toca otra vez para eliminar'; return; } const o = ED; cerrar(); borrar('pedido', o); },
    sig: id => { const p = D.pedidos.find(x => x.id === id); const e = sigE(p.estado); if (e) guardar('pedido', { ...p, estado: e, ...(e === 'entregado' ? { entregadoEn: Date.now() } : {}) }, true); },
    entregado: id => { const p = D.pedidos.find(x => x.id === id); guardar('pedido', { ...p, estado: 'entregado', entregadoEn: Date.now() }, true); },
    calcRutas: () => calcularRutas(),
    guardarPlan: () => {
      if (!PLAN) return; const objs = [];
      PLAN.reps.forEach(r => r.viajes.forEach((v, k) => v.paradas.forEach((s, j) => objs.push({ ...s.pedido, ruta: { rep: r.rep.nombre, viaje: k + 1, orden: j + 1, salida: PK.hm(v.salida), eta: PK.hm(s.llegada) } }))));
      guardarVarios('pedido', objs);
    },
    copiarRuta: i => copiar(PK.tms.textoRepartidor(PLAN.reps[+i], cfg())),
    ubicar: async (id, b) => { const p = D.pedidos.find(x => x.id === id); b.disabled = true; b.textContent = 'Buscando…'; const r = await PK.geocode(p.direccion + ', ' + (p.barrio || ''), cfg()); if (r) { await guardar('pedido', { ...p, lat: r.lat, lng: r.lng, km: Math.round(PK.km(cfg().base, r) * 10) / 10 }); toast('Ubicado. Recalcula las rutas.'); } else { b.disabled = false; b.textContent = 'No la encontré'; } },
    nuevoProd: () => editorProd({ id: PK.uid(), nombre: '', precio: 0, categoria: '', descripcion: '', sinonimos: '', anticipacionHoras: 0, destacado: false, activo: true, foto: '' }),
    abrirProd: id => editorProd(D.catalogo.find(p => p.id === id)),
    guardarProd: async () => {
      const antes = D.catalogo.find(p => p.id === ED.id);
      const o = { ...ED, nombre: $('#p-nombre').value.trim(), precio: num($('#p-precio').value), categoria: $('#p-categoria').value.trim() || 'Otros', descripcion: $('#p-descripcion').value.trim(), sinonimos: $('#p-sinonimos').value.trim(), anticipacionHoras: num($('#p-anticipacion').value), destacado: $('#p-destacado').value === '1', activo: $('#p-activo').value === '1' };
      if (!o.nombre) { $('#p-nombre').focus(); return; }
      if (antes && num(antes.precio) && num(antes.precio) !== o.precio) { PK.fin.registrarPrecio(D.memoria, o, antes.precio, o.precio); PK.store.guardar('memoria', D.memoria, CLAVE).catch(() => {}); }
      cerrar(); await guardar('producto', o);
    },
    borrarProd: (id, b) => { if (!b.dataset.ok) { b.dataset.ok = 1; b.textContent = 'Toca otra vez para eliminar'; return; } const o = ED; cerrar(); borrar('producto', o); },
    nuevaRec: () => { RE = nuevaReceta(); render(true); },
    abrirRec: id => { RE = JSON.parse(JSON.stringify(D.recetas.find(r => r.id === id))); render(true); },
    addIng: () => { RE.ingredientes.push({ nombre: '', precioCompra: '', cantCompra: '', unidad: 'g', cantUsada: '' }); pintarIng(); },
    rmIng: id => { RE.ingredientes.splice(+id, 1); pintarIng(); },
    guardarRec: async () => { if (!RE.nombre.trim()) { $('#r-nombre').focus(); return; } const r = { ...RE, ingredientes: RE.ingredientes.filter(i => i.nombre), actualizada: Date.now() }; await guardar('receta', r); render(true); },
    borrarRec: (id, b) => { if (!b.dataset.ok) { b.dataset.ok = 1; b.textContent = 'Toca otra vez para eliminar'; return; } const r = RE; RE = null; borrar('receta', r); render(true); },
    borrarGasto: id => borrar('gasto', D.gastos.find(g => g.id === id)),
    aplicarPrecio: (id, b) => { const p = D.catalogo.find(x => x.id === id), v = num(b.dataset.v); PK.fin.registrarPrecio(D.memoria, p, p.precio, v); D.memoria.decisiones.push({ fecha: PK.today(), texto: `Subí ${p.nombre} de ${money(p.precio)} a ${money(v)}, por consejo del asesor` }); PK.store.guardar('memoria', D.memoria, CLAVE).catch(() => {}); guardar('producto', { ...p, precio: v }); },
    decidir: i => { const x = ASE.acciones[+i]; D.memoria.decisiones.push({ fecha: PK.today(), texto: 'Voy a: ' + x.titulo }); guardar('memoria', D.memoria); },
    cierreMes: () => { const ym = PK.mes(PK.today()); D.memoria.cierres = D.memoria.cierres.filter(c => c.mes !== ym).concat([PK.fin.snapshot(D, ym)]); guardar('memoria', D.memoria); },
    guardarCfg: async () => { const c = leerAjustes(); enEdicion = false; await guardar('config', c); $('#bn').textContent = c.nombre; PLAN = null; render(true); },
    addFila: id => { const tb = document.querySelector('#' + id + ' tbody'), tr = tb.rows[tb.rows.length - 1]; const n = tr ? tr.cloneNode(true) : null; if (!n) return; n.querySelectorAll('input').forEach(i => { if (i.type === 'checkbox') i.checked = true; else i.value = ''; }); tb.appendChild(n); },
    rmFila: (id, b) => { const tr = b.closest('tr'); if (tr.parentNode.rows.length > 1) tr.remove(); else tr.querySelectorAll('input').forEach(i => { if (i.type !== 'checkbox') i.value = ''; }); },
    baseGPS: () => { if (!navigator.geolocation) return toast('Este navegador no da la ubicación'); navigator.geolocation.getCurrentPosition(p => { $('#c-lat').value = p.coords.latitude.toFixed(6); $('#c-lng').value = p.coords.longitude.toFixed(6); toast('Ubicación tomada. Guarda los ajustes.'); }, () => toast('No se pudo obtener la ubicación'), { enableHighAccuracy: true, timeout: 15000 }); },
    baseBuscar: async () => { const r = await PK.geocode($('#c-dir').value, { ...cfg(), base: { lat: 4.6, lng: -74.08 } }); if (r) { $('#c-lat').value = r.lat.toFixed(6); $('#c-lng').value = r.lng.toFixed(6); toast('Dirección encontrada. Guarda los ajustes.'); } else toast('No encontré la dirección. Usa tu ubicación o pega un link de Maps.'); },
    borrarEjemplos: () => { PK.store.borrarEjemplos(); cargar(); toast('Datos de ejemplo borrados'); },
    reiniciarDemo: () => { PK.store.reiniciarDemo(); cargar(); toast('Demostración restaurada'); }
  };
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const f = A[b.dataset.a]; if (!f) return; e.preventDefault(); f(b.dataset.id, b);
  });
  $('#ov').addEventListener('click', e => { if (e.target.id === 'ov') cerrar(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#ov').hidden) cerrar(); });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.it != null && ED) { const i = ED.items[+t.dataset.it]; if (t.dataset.k === 'id') { const p = D.catalogo.find(x => x.id === t.value); if (p) { i.id = p.id; i.nombre = p.nombre; i.precio = num(p.precio); t.parentNode.querySelector('[data-k=precio]').value = i.precio; } } else i[t.dataset.k] = num(t.value); totPed(); }
    else if (t.id === 'o-domicilio') totPed();
    else if (t.dataset.ing != null && RE) { RE.ingredientes[+t.dataset.ing][t.dataset.k] = t.value; recRes(); }
    else if (t.dataset.f && RE) { RE[t.dataset.f] = t.value; recRes(); }
    else if (t.id === 'fq') { F.q = t.value; clearTimeout(A._q); A._q = setTimeout(() => { const pos = t.selectionStart; render(); const n = $('#fq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 300); }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.it != null && ED && t.dataset.k === 'id') { const p = D.catalogo.find(x => x.id === t.value); if (p) { const i = ED.items[+t.dataset.it]; i.id = p.id; i.nombre = p.nombre; i.precio = num(p.precio); t.parentNode.querySelector('[data-k=precio]').value = i.precio; totPed(); } }
    if (t.dataset.f && RE) { RE[t.dataset.f] = t.value; recRes(); }
    if (t.id === 'fr') { F.rango = t.value; render(); } if (t.id === 'fe') { F.estado = t.value; render(); }
    if (t.id === 'rf') { F.rutaF = t.value; render(); } if (t.id === 'fm') { F.mes = t.value; render(); } if (t.id === 'gm') { F.gmes = t.value; render(); }
  });
  document.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id === 'gf') { const v = num($('#g-val').value); if (!v) { $('#g-val').focus(); return; } guardar('gasto', { id: PK.uid(), fecha: $('#g-fecha').value || PK.today(), categoria: $('#g-cat').value, concepto: $('#g-con').value.trim(), valor: v }); }
    if (e.target.id === 'decF') { const t = $('#decT').value.trim(); if (!t) return; D.memoria.decisiones.push({ fecha: PK.today(), texto: t }); guardar('memoria', D.memoria); }
  });
  window.addEventListener('hashchange', () => { enEdicion = false; render(true); window.scrollTo(0, 0); if (view() === 'rutas' && PLANF !== F.rutaF) calcularRutas(); });

  /* ---------------- arranque ---------------- */
  let reloj = null;
  function arrancar() {
    $('#demo').hidden = !PK.demo;
    cargar().then(() => { if (view() === 'rutas') calcularRutas(); });
    if (!PK.demo && !reloj) reloj = setInterval(() => { if (document.visibilityState === 'visible' && D && $('#ov').hidden && !enEdicion) cargar(true); }, 60000);
  }
  PK.nube.iniciar('panel').then(ok => { if (ok) arrancar(); else asistente(); }).catch(() => asistente());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') document.title = 'Ponkezza · Panel'; });
})();

</script>
</body>
</html>
